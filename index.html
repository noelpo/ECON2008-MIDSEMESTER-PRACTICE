const questions=[{"scenario": "Calls reach a help desk according to a Poisson process at a constant rate of five per hour. Let N be the number of calls in the next two hours and T the time from now until the next call.", "prompt": "Which pair of distributions correctly models N and T?", "options": ["N is binomial; T is uniform", "Both are Poisson", "N is exponential; T is Poisson", "N is Poisson; T is exponential"], "answer": 3, "explanation": "A Poisson process gives a Poisson count over a fixed interval and an exponential waiting time. N has mean 5 × 2 = 10 calls, while T has rate 5 per hour.", "visual": ""}, {"scenario": "Six people are selected independently from a very large population. Each person has probability 0.40 of volunteering. Let X be the number who volunteer.", "prompt": "What is P(X = 2), to four decimal places?", "options": ["0.2765", "0.1382", "0.5443", "0.3110"], "answer": 3, "explanation": "P(X = 2) = C(6,2)(0.40)²(0.60)⁴ = 15 × 0.16 × 0.1296 = 0.31104, which rounds to 0.3110.", "visual": ""}, {"scenario": "Each of eight independently inspected items has a 0.10 probability of being defective.", "prompt": "What is the probability that at least one item is defective?", "options": ["0.0383", "0.8000", "0.4305", "0.5695"], "answer": 3, "explanation": "Use the complement: P(at least one) = 1 − P(none) = 1 − (0.90)⁸ = 0.56953279, approximately 0.5695.", "visual": ""}, {"scenario": "Four dimensionless random variables are proposed: A is binomial with n = 20 and p = 0.30; B is Poisson with mean 5; C is exponential with mean 2; D is uniform on [0, 6].", "prompt": "Which variable has the largest variance?", "options": ["D", "A", "B", "C"], "answer": 2, "explanation": "Var(A) = 20(0.30)(0.70) = 4.2. Var(B) = 5. Var(C) = 2² = 4. Var(D) = (6 − 0)²/12 = 3. B has the largest variance.", "visual": ""}, {"scenario": "Messages arrive according to a Poisson process with an average of three messages every five minutes.", "prompt": "What is the probability of receiving at least two messages in the next two minutes?", "options": ["0.6626", "0.8009", "0.3374", "0.3012"], "answer": 2, "explanation": "The two minute mean is λ = 3 × 2/5 = 1.2. P(N ≥ 2) = 1 − e⁻¹·²(1 + 1.2) = 0.33737273, approximately 0.3374.", "visual": ""}, {"scenario": "A random variable X has a Poisson distribution and satisfies P(X = 0) = 3P(X = 1).", "prompt": "What is P(X ≤ 1), to four decimal places?", "options": ["0.7358", "0.9554", "0.7165", "0.1991"], "answer": 1, "explanation": "Since e⁻λ = 3λe⁻λ, λ = 1/3. P(X ≤ 1) = e⁻¹ᐟ³(1 + 1/3) = 0.95537508, approximately 0.9554.", "visual": ""}, {"scenario": "A rare characteristic occurs independently in each person with probability 0.0025. A random sample contains 800 people. Use a Poisson approximation for the number X with the characteristic.", "prompt": "What is the approximate probability P(X ≥ 3)?", "options": ["0.2707", "0.1429", "0.6767", "0.3233"], "answer": 3, "explanation": "The approximating mean is λ = np = 800 × 0.0025 = 2. P(X ≥ 3) = 1 − e⁻²(1 + 2 + 2²/2) = 1 − 5e⁻² = 0.32332358.", "visual": ""}, {"scenario": "A manufacturer checks 1,000 independent units, each with defect probability 0.003. It wants a convenient approximation to the distribution of the total number of defects.", "prompt": "Which approximation is most appropriate among the choices?", "options": ["A normal distribution with mean 3 and variance 1,000", "An exponential distribution with mean 3", "A Poisson distribution with mean 3", "A uniform distribution from 0 to 1,000"], "answer": 2, "explanation": "There are many independent trials with a small success probability. The Poisson approximation has mean np = 1,000 × 0.003 = 3. A normal approximation is poorly suited because np is small.", "visual": ""}, {"scenario": "Calls arrive according to a Poisson process at six calls per hour. T is the waiting time, in minutes, until the next call.", "prompt": "What is P(10 < T < 20)?", "options": ["0.8647", "0.1353", "0.3679", "0.2325"], "answer": 3, "explanation": "Convert the rate to 6/60 = 0.10 per minute. P(10 < T < 20) = e⁻⁰·¹⁽¹⁰⁾ − e⁻⁰·¹⁽²⁰⁾ = e⁻¹ − e⁻² = 0.23254416.", "visual": ""}, {"scenario": "A component has an exponential lifetime with mean five years. It has already survived seven years.", "prompt": "What is the probability that its total lifetime exceeds twelve years, given that it has survived seven years?", "options": ["0.7534", "0.0907", "0.3679", "0.2466"], "answer": 2, "explanation": "By the memoryless property, P(T > 12 | T > 7) = P(T > 5) = e⁻⁵ᐟ⁵ = e⁻¹ = 0.36787944. The conditioning removes the seven years already survived.", "visual": ""}, {"scenario": "Waiting time T is exponential with a mean of four minutes. A manager sets a target time c so that 95% of waits are no longer than c.", "prompt": "What is c, rounded to two decimal places?", "options": ["4.00 minutes", "0.21 minutes", "7.82 minutes", "11.98 minutes"], "answer": 3, "explanation": "Solve 1 − e⁻ᶜᐟ⁴ = 0.95. Then e⁻ᶜᐟ⁴ = 0.05 and c = −4 ln(0.05) = 11.982929 minutes.", "visual": ""}, {"scenario": "A shuttle’s arrival time X, measured in minutes after 9:00 AM, is uniformly distributed between 8 and 28. The shuttle has not arrived by minute 14.", "prompt": "What is P(X > 20 | X > 14)?", "options": ["0.7000", "0.4000", "0.2857", "0.5714"], "answer": 3, "explanation": "Conditioning restricts X to (14,28), an interval of length 14. The favourable interval is (20,28), of length 8. Probability = 8/14 = 0.57142857.", "visual": ""}, {"scenario": "A delivery duration X is uniformly distributed between 10 and 50 minutes. A central interval must contain 80% of delivery durations, leaving equal probabilities in its two tails.", "prompt": "Which interval meets this requirement?", "options": ["[18, 42] minutes", "[10, 42] minutes", "[14, 46] minutes", "[12, 48] minutes"], "answer": 2, "explanation": "Each tail contains 10%. The 10th percentile is 10 + 0.10(40) = 14 and the 90th percentile is 10 + 0.90(40) = 46. The interval length 32 is 80% of the full length 40.", "visual": ""}, {"scenario": "A continuous random variable X has density f(x) = k/x³ for 1 < x < 3, and f(x) = 0 elsewhere. Choose k so that the density is valid.", "prompt": "What value of k is required?", "options": ["9/8", "3/2", "4/9", "9/4"], "answer": 3, "explanation": "Total probability is 1: k ∫₁³ x⁻³ dx = k[−1/(2x²)]₁³ = k(1/2 − 1/18) = 4k/9. Thus k = 9/4.", "visual": ""}, {"scenario": "A continuous random variable X has density f(x) = k/x³ for 1 < x < 3, and f(x) = 0 elsewhere. Choose k so that the density is valid.", "prompt": "What is E(X)?", "options": ["2", "3/2", "9/4", "4/3"], "answer": 1, "explanation": "First normalise to obtain k = 9/4. E(X) = (9/4)∫₁³ x⁻² dx = (9/4)[−1/x]₁³ = (9/4)(2/3) = 3/2.", "visual": ""}, {"scenario": "A continuous random variable X has density f(x) = k/x³ for 1 < x < 3, and f(x) = 0 elsewhere. Choose k so that the density is valid.", "prompt": "What is the median of X, rounded to four decimal places?", "options": ["1.7321", "2.0000", "1.3416", "1.5000"], "answer": 2, "explanation": "With k = 9/4, F(x) = (9/8)(1 − 1/x²) on the support. Set F(m) = 1/2: 1 − 1/m² = 4/9, so m² = 9/5 and m = 3/√5 = 1.34164079.", "visual": ""}, {"scenario": "A continuous random variable X has density f(x) = (3/4)(1 − x²) for −1 < x < 1, and zero elsewhere.", "prompt": "What is Var(X)?", "options": ["0.2000", "0.5000", "0.4000", "0"], "answer": 0, "explanation": "Symmetry gives E(X) = 0. E(X²) = (3/4)∫₋₁¹(x² − x⁴) dx = (3/4)(2/3 − 2/5) = 1/5. Variance = E(X²) − [E(X)]² = 0.2.", "visual": ""}, {"scenario": "A bank waiting time T, in minutes, has density f(t) = 2k(10 − t) for 0 < t < 10, and zero elsewhere. The constant k makes this a valid density.", "prompt": "What is k?", "options": ["1/10", "1/50", "1/200", "1/100"], "answer": 3, "explanation": "The integral is 2k[10t − t²/2]₀¹⁰ = 2k(50) = 100k. Equating this to 1 gives k = 1/100.", "visual": ""}, {"scenario": "A bank waiting time T, in minutes, has density f(t) = 2k(10 − t) for 0 < t < 10, and zero elsewhere. The constant k makes this a valid density.", "prompt": "What is the interquartile range, to four decimal places?", "options": ["3.6603 minutes", "1.3397 minutes", "6.8301 minutes", "5.0000 minutes"], "answer": 0, "explanation": "Here F(t) = 1 − (1 − t/10)². The percentile formula is qₚ = 10[1 − √(1 − p)]. Q₁ = 1.33974596 and Q₃ = 5. IQR = Q₃ − Q₁ = 3.66025404 minutes.", "visual": ""}, {"scenario": "A bank waiting time T, in minutes, has density f(t) = 2k(10 − t) for 0 < t < 10, and zero elsewhere. The constant k makes this a valid density.", "prompt": "What is P(T > 6 | T > 2)?", "options": ["0.4000", "0.6400", "0.2500", "0.1600"], "answer": 2, "explanation": "The survival function is P(T > t) = (1 − t/10)². The conditional probability is 0.4²/0.8² = 0.16/0.64 = 0.25. This density is not exponential, so the memoryless shortcut does not apply.", "visual": ""}, {"scenario": "A continuous random variable X has density f(x) = kx³e⁻²ˣ for x > 0, and zero elsewhere. The constant k makes the density valid. You may use ∫₀∞ xⁿe⁻ᵃˣ dx = n!/aⁿ⁺¹ for a > 0 and nonnegative integer n.", "prompt": "What is k?", "options": ["6", "4/3", "8/3", "1/6"], "answer": 2, "explanation": "The integral without k is 3!/2⁴ = 6/16 = 3/8. Hence k(3/8) = 1 and k = 8/3.", "visual": ""}, {"scenario": "A continuous random variable X has density f(x) = kx³e⁻²ˣ for x > 0, and zero elsewhere. The constant k makes the density valid. You may use ∫₀∞ xⁿe⁻ᵃˣ dx = n!/aⁿ⁺¹ for a > 0 and nonnegative integer n.", "prompt": "What is E(X)?", "options": ["8/3", "4", "2", "1/2"], "answer": 2, "explanation": "Using k = 8/3, E(X) = (8/3)∫₀∞ x⁴e⁻²ˣ dx = (8/3)(4!/2⁵) = (8/3)(24/32) = 2.", "visual": ""}, {"scenario": "A random sample of 144 independent observations has mean 53. The population standard deviation is known to be 12. Assume the sampling distribution of the mean is normal. Use z = 1.96 for a 95% confidence interval.", "prompt": "What is the 95% confidence interval for the population mean?", "options": ["(51.355, 54.645)", "(51.04, 54.96)", "(29.48, 76.52)", "(52.02, 53.98)"], "answer": 1, "explanation": "Standard error = 12/√144 = 1. Margin of error = 1.96 × 1 = 1.96. Interval = 53 ± 1.96 = (51.04, 54.96).", "visual": ""}, {"scenario": "A random sample produces a mean of 7.80 hours and a known standard error of 0.45 hours. Test H₀: μ = 7 using a normal test. The 5% critical values are 1.645 for an upper tail test and ±1.96 for a two sided test.", "prompt": "Which combination of conclusions is correct at the 5% level?", "options": ["Fail to reject for both alternatives", "Fail to reject for μ > 7, but reject for μ ≠ 7", "Reject for both μ > 7 and μ ≠ 7", "Reject for μ > 7, but fail to reject for μ ≠ 7"], "answer": 3, "explanation": "z = (7.80 − 7)/0.45 = 1.7778. This exceeds 1.645 but is below 1.96. Reject for the upper tail alternative and fail to reject for the two sided alternative.", "visual": ""}, {"scenario": "A confidence interval for μ is constructed using a normal method with a known standard error. The 95% interval is (6.94, 8.06), using z = 1.96. A researcher tests H₀: μ = 7 against H₁: μ ≠ 7 at α = 0.10. The two sided 10% critical values are ±1.645.", "prompt": "What is the correct decision?", "options": ["Reject H₀ because the corresponding 90% interval excludes 7", "The given interval cannot provide the standard error", "Accept H₀ because the sample mean is close to 7", "Fail to reject because 7 lies in the 95% interval"], "answer": 0, "explanation": "The mean is the midpoint 7.50 and the 95% margin is 0.56. SE = 0.56/1.96 = 0.285714. z = 0.50/0.285714 = 1.75 > 1.645. The 90% interval is 7.50 ± 0.47 = (7.03, 7.97), excluding 7.", "visual": ""}, {"scenario": "A valid hypothesis test produces a p value of 0.032. The same result is assessed at significance levels of 0.10, 0.05 and 0.01.", "prompt": "At which levels should H₀ be rejected?", "options": ["Only at 0.10", "At all three levels", "At none of the three levels", "At 0.10 and 0.05, but not at 0.01"], "answer": 3, "explanation": "Reject H₀ when the p value is no greater than α. Here 0.032 < 0.10 and 0.05, but 0.032 > 0.01.", "visual": ""}, {"scenario": "A study produces a p value of 0.004 and a standardised effect size of 0.03. Before analysing the data, the organisation defines an absolute effect size below 0.20 as too small to be practically important.", "prompt": "Which interpretation is supported?", "options": ["The null hypothesis is proven false and the effect is large", "Fail to reject H₀ at 1%, but regard the effect as important", "The effect is practically important because the p value is small", "Reject H₀ at 1%, but the effect falls below the stated practical importance threshold"], "answer": 3, "explanation": "The p value 0.004 is below 0.01, so the result is statistically significant at 1%. However, the effect size 0.03 is below the organisation’s threshold 0.20. Statistical significance does not imply practical importance.", "visual": ""}, {"scenario": "A researcher wants a 95% confidence interval for a population mean with a margin of error no greater than 2.5. The known population standard deviation is 15 and the critical value is 1.96.", "prompt": "What is the smallest required sample size?", "options": ["139", "140", "35", "138"], "answer": 0, "explanation": "n ≥ (zσ/E)² = (1.96 × 15/2.5)² = 138.2976. Always round up to satisfy the maximum margin requirement, giving n = 139.", "visual": ""}, {"scenario": "A random sample of 16 observations from a normal population has mean 102 and sample standard deviation 8. Test H₀: μ = 100 against H₁: μ ≠ 100. The population standard deviation is unknown. The two sided 5% critical t value for 15 degrees of freedom is 2.131.", "prompt": "Which result is correct?", "options": ["t = 4.00, df = 16; reject H₀", "t = 0.25, df = 16; accept H₀ as true", "z = 1.00, df = 15; reject H₀", "t = 1.00, df = 15; fail to reject H₀"], "answer": 3, "explanation": "Use t because σ is unknown. t = (102 − 100)/(8/√16) = 2/2 = 1, with df = 16 − 1 = 15. Since |1| < 2.131, fail to reject H₀; this does not establish that H₀ is true.", "visual": ""}, {"scenario": "A correctly specified two sided hypothesis test gives a p value of 0.018.", "prompt": "Which statement correctly interprets this p value?", "options": ["Assuming H₀ is true, the probability of a test statistic at least as extreme as the observed one, in either direction, is 0.018", "There is a 98.2% probability that H₁ is true", "Exactly 1.8% of the observations are incorrect", "The probability that H₀ is true is 0.018"], "answer": 0, "explanation": "A p value is a tail probability calculated under the null hypothesis and the test model. It is not the probability that the null or alternative hypothesis is true.", "visual": ""}];

// Standalone practice exam. All marking happens locally; no scores are sent to a server.
// Increment this key when publishing a different question set.
const KEY='nlts-econ2008-challenge-v1';
const DURATION=60*60*1000;
const app=document.getElementById('app');
const dialog=document.getElementById('confirm');
let state=null, interval=null, storageOK=true;
let celebrationTimeout=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(s){return s&&s.version===1&&typeof s.name==='string'&&Number.isFinite(s.deadline)&&Number.isFinite(s.started)&&Number.isInteger(s.index)&&s.index>=0&&s.index<questions.length&&Array.isArray(s.answers)&&s.answers.length===questions.length&&s.answers.every((a,i)=>a===null||(Number.isInteger(a)&&a>=0&&a<questions[i].options.length))&&(s.done||s.answers.slice(0,s.index).every(a=>a!==null))&&typeof s.done==='boolean';}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved))state=saved;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;const n=document.getElementById('storageWarning');if(n)n.classList.remove('hidden');}}
function remaining(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function start(){const name=document.getElementById('studentName').value.trim();if(!name){document.getElementById('nameError').textContent='Please enter your name before starting.';document.getElementById('studentName').focus();return;}const t=Date.now();state={version:1,name,started:t,deadline:t+DURATION,index:0,answers:Array(30).fill(null),done:false};save();renderQuestion();runTimer();}
function intro(){app.innerHTML=`<div class="intro"><section><div class="eyebrow">ECON2008 · Practice examination</div><h1>Midsemester<br>Mock Exam</h1><p class="muted">Build your confidence with 30 challenging original questions modelled on your ECON2008 sample questions.</p><div class="stats"><div class="stat"><strong>30</strong><span>Multiple choice questions</span></div><div class="stat"><strong>60</strong><span>Minutes to complete</span></div><div class="stat"><strong>1</strong><span>Mark per question</span></div></div><p><strong>No limits to what you can achieve.</strong></p></section><section class="panel"><div class="eyebrow">Before you begin</div><h2>Your exam instructions</h2><ol class="rules"><li>Each page shows one question with its complete scenario.</li><li>Choose one answer, then select <strong>Save & continue</strong>. You cannot return to an earlier question.</li><li>There is no skip button. You must select an answer before continuing.</li><li>The timer begins when you start. It continues if you refresh or leave the page.</li><li>Your exam submits automatically when time expires. Answers and explanations appear only after submission.</li><li>A scientific calculator is permitted. Round only your final answer as requested. Any required statistical critical values are included in the question.</li><li>After submission, you may start another attempt with a fresh one hour timer.</li></ol><form id="startForm"><label class="name" for="studentName">Student name</label><input id="studentName" type="text" maxlength="100" autocomplete="name" placeholder="Enter your full name" required><p id="nameError" class="error" role="alert"></p><button class="btn wide" type="submit">Start mock exam <span aria-hidden="true">→</span></button></form><p class="note">Your name and responses stay in this browser. Results are not sent to NLTS. Use your own browser profile on a shared device.</p><p class="error ${storageOK?'hidden':''}">Browser storage is unavailable. Keep this page open to preserve your attempt.</p></section></div>`;document.getElementById('startForm').onsubmit=e=>{e.preventDefault();start();};}
function renderQuestion(){if(state.done){results();return;}if(remaining()===0){finish(true);return;}const q=questions[state.index];app.innerHTML=`<div class="topbar"><div><div class="eyebrow">Midsemester Mock Exam</div><strong>${esc(state.name)}</strong></div><div class="timer" id="timer" role="timer" aria-label="Time remaining"><small>TIME REMAINING</small><strong id="clock">60:00</strong></div></div><div class="progress" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="30" aria-valuenow="${state.index}"><span style="width:${state.index/30*100}%"></span></div><div class="examgrid"><aside class="side"><div class="panel"><div class="eyebrow">Your progress</div><h2>${state.index+1} <span class="muted">/ 30</span></h2><h3>Forward only</h3><p>Once you continue, this question is locked.</p><h3>One best answer</h3><p>Each correct answer earns one mark. No marks are deducted for an incorrect response.</p><p>Answers become available after you submit.</p></div></aside><section class="panel" aria-labelledby="questionTitle"><span class="tag">Question ${state.index+1}</span><div class="scenario"><div class="eyebrow">Scenario</div><p>${esc(q.scenario)}</p></div>${q.visual}<h2 id="questionTitle" tabindex="-1">${esc(q.prompt)}</h2><fieldset class="options"><legend>Select one answer for question ${state.index+1}</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${state.answers[state.index]===i?'checked':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</fieldset><div class="actions"><button class="btn" id="next" ${state.answers[state.index]===null?'disabled':''}>${state.index===29?'Submit exam':'Save & continue'} <span aria-hidden="true">→</span></button></div><p id="storageWarning" class="error ${storageOK?'hidden':''}" role="alert">Browser storage is unavailable. Keep this page open to preserve your attempt.</p><p class="note">Question ${state.index+1} of 30 · No return to previous questions</p></section></div><p id="timeNotice" class="error" role="status"></p>`;app.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(remaining()===0){finish(true);return;}state.answers[state.index]=Number(el.value);save();document.getElementById('next').disabled=false;});document.getElementById('next').onclick=()=>advance();tick();}
function advance(){if(state.done)return;if(remaining()===0){finish(true);return;}if(state.answers[state.index]===null)return;if(state.index===29){document.getElementById('confirmText').textContent=`You have answered ${state.answers.filter(a=>a!==null).length} of 30 questions. Your score and correct answers will appear after submission.`;dialog.showModal();return;}state.index++;save();renderQuestion();window.scrollTo(0,0);document.getElementById('questionTitle')?.focus({preventScroll:true});}
function tick(){if(!state||state.done)return;const secs=remaining();if(secs===0){finish(true);return;}const clock=document.getElementById('clock');if(clock)clock.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');document.getElementById('timer')?.classList.toggle('urgent',secs<=300);const notice=document.getElementById('timeNotice');if(notice&&secs<=300&&!notice.textContent)notice.textContent='Five minutes or less remain. Your exam will submit automatically when the timer reaches zero.';}
function runTimer(){clearInterval(interval);tick();if(!state.done)interval=setInterval(tick,250);}
function finish(timeout){if(!state||state.done)return;state.done=true;state.timedOut=!!timeout||remaining()===0;state.finished=Date.now();save();clearInterval(interval);if(dialog.open)dialog.close();results();window.scrollTo(0,0);}
function gradeFeedback(score){const percent=score/questions.length*100;if(score===questions.length)return {icon:'',title:'Perfect score! Congratulations!',message:'You answered every question correctly. Celebrate your achievement!'};if(percent>=80)return {icon:'',title:'Excellent performance!',message:'You are doing very well. Review your missed questions and aim for 100%.'};if(percent>=70)return {icon:'',title:'Good work!',message:'You have a strong foundation. Review the explanations and practise again.'};if(percent>=50)return {icon:'',title:'Keep building your confidence!',message:'Review your incorrect answers, work through the explanations and try again.'};return {icon:'',title:'Every attempt is a chance to improve.',message:'Take your time with the explanations. Practise each calculation and return for another attempt.'};}
function clearCelebration(){clearTimeout(celebrationTimeout);document.getElementById('celebration')?.remove();}

function retry(){if(!state||!state.done)return;clearCelebration();clearInterval(interval);const name=state.name;const attempt=(Number.isInteger(state.attempt)?state.attempt:1)+1;state=null;intro();document.getElementById('studentName').value=name;const form=document.getElementById('startForm');form.onsubmit=e=>{e.preventDefault();start();if(state){state.attempt=attempt;save();}};window.scrollTo(0,0);document.getElementById('studentName').focus();}
function results(){const score=questions.reduce((sum,q,i)=>sum+(state.answers[i]===q.answer?1:0),0);const feedback=gradeFeedback(score);const answered=state.answers.filter(a=>a!==null).length;const mins=Math.min(60,Math.max(0,Math.ceil(((state.finished||state.deadline)-state.started)/60000)));app.innerHTML=`<section class="resulthead"><div><div class="eyebrow">Exam complete · Attempt ${state.attempt||1}</div><h1 style="font-size:34px;margin:12px 0">${esc(state.name)}, here are your results.</h1><p class="muted">${state.timedOut?'Time expired. Your saved responses were submitted automatically.':'Your exam has been submitted.'}</p><div class="grade-message">${feedback.title}</div><p class="muted">${feedback.message}</p><p class="muted">${answered} answered · ${30-answered} unanswered · ${mins} minutes used</p></div><div><div class="score">${score}<span style="font-size:24px;color:#bfcce4"> / 30</span></div><strong>${(score/30*100).toFixed(1)}%</strong></div></section><div class="notice">Your result is saved on this browser only. Print or save it as a PDF to share it with your tutor. For information about tutoring, contact us at <a href="tel:18765692703">18765692703</a>.</div><div class="result-buttons"><button class="btn" id="retry">Try again</button><button class="btn secondary printbutton" id="print">Print results / Save as PDF</button></div><p class="note">You can attempt this quiz as many times as you like. Each new attempt starts with 60 minutes and cleared answers. The same 30 questions are used. Save your result before starting again.</p><h2 style="margin-top:32px">Answer key and explanations</h2><p class="muted">Review each scenario, your response and the correct answer.</p>${questions.map((q,i)=>{const a=state.answers[i],right=a===q.answer;return `<article class="review"><span class="tag">Question ${i+1}</span><span class="${right?'correct':'wrong'}" style="float:right;font-weight:700">${right?'Correct':'0 marks'}</span><div class="scenario"><p>${esc(q.scenario)}</p></div>${q.visual}<h3>${esc(q.prompt)}</h3><p class="${right?'correct':'wrong'}"><strong>Your answer:</strong> ${a===null?'Not answered':String.fromCharCode(65+a)+'. '+esc(q.options[a])}</p><p class="correct"><strong>Correct answer:</strong> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</p><p><strong>Explanation:</strong> ${esc(q.explanation)}</p></article>`;}).join('')}<p class="note">This is an original NLTS practice exam based on the supplied sample questions, not an official university examination.</p>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('retry').onclick=retry;clearCelebration();}
document.getElementById('cancelSubmit').onclick=()=>dialog.close();document.getElementById('confirmSubmit').onclick=()=>finish(false);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});window.addEventListener('pageshow',tick);window.addEventListener('beforeunload',e=>{if(state&&!state.done){e.preventDefault();e.returnValue='';}});
// The exam never uses browser history to move between questions.
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(valid(s)){state=s;if(state.done){clearInterval(interval);if(dialog.open)dialog.close();results();}else{renderQuestion();runTimer();}}}catch(err){}}});
if(state){if(state.done)results();else{renderQuestion();runTimer();}}else intro();
</script></body></html>
